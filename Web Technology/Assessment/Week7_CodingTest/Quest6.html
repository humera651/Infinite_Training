<!DOCTYPE html>
<html>
<body>
<h1>Select single element</h1>

<ul style="cursor: pointer;">
  <li>CSHARP</li>
  <li>SQL</li>
  <li>ADO</li>
</ul>

<p id="result"></p>

<script src="jquery-3.7.1.min.js"></script>

<script>
$("li").on("click", function () {
  let selected = $(this).text();
  $("#result").text("Selected item is: " + selected);
});
</script>

</body>
</html>
