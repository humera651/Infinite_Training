<!DOCTYPE html>
<html>
<body>

<h1>Multiply And Divide</h1>

1st Number: <input id="firstNum"><br><br>
2nd Number: <input id="secondNum"><br><br>

<button onclick="multiply()">Multiply</button>
<button onclick="divide()">Divide</button>

<p>The Result Is:</p>
<p id="result"></p>

<script>
function multiply() {
  var x = parseInt(document.getElementById("firstNum").value);
  var y = parseInt(document.getElementById("secondNum").value);
  document.getElementById("result").innerText = x * y;
}

function divide() {
  var x = parseInt(document.getElementById("firstNum").value);
  var y = parseInt(document.getElementById("secondNum").value);
  document.getElementById("result").innerText = x / y;
}
</script>

</body>
</html>
