<!DOCTYPE html>
<html>
<body>

<h1>Odd / Even Numbers from 0 to 15</h1>
<p id="result"></p>

<script>
let num = "";

for (let index = 0; index <= 15; index++) {
  if (index % 2 === 0)
    num += '"' + index + ' is even"<br>';
  else
    num += '"' + index + ' is odd"<br>';
}

document.getElementById("result").innerHTML = num;
</script>

</body>
</html>
