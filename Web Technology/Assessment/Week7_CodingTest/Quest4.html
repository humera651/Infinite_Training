<!DOCTYPE html>
<html>
<head>
<style>    
table, td {
  border: 2px double black;
  border-collapse: collapse;
  padding: 5px;
}
tr:nth-child(odd) {
  display: none;
}
</style>
</head>

<body>

<h1>Hide all odd table rows in a table</h1>

<table>
  <tr><td>Row 1</td></tr>
  <tr><td>Row 2</td></tr>
  <tr><td>Row 3</td></tr>
  <tr><td>Row 4</td></tr>
  <tr><td>Row 5</td></tr>
  <tr><td>Row 6</td></tr>
  <tr><td>Row 7</td></tr>
  <tr><td>Row 8</td></tr>
</table>

</body>
</html>
