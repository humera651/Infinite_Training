<!DOCTYPE html>
<html>
<head>
<script src="jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="hover" style="width:200px;height:100px;background:cyan;">
Hover Me
</div>
<script>

$("#hover").mouseover(function () {
    $(this).css("background", "cyan");
});

$("#hover").mouseout(function () {
    $(this).css("background", "pink");
});
</script>
</body>
</html>
